<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(200%); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .bg-rect { fill: #000000; stroke: #000000; stroke-width: 4; }
      .header-text { font-family: 'Space Mono', 'Courier New', monospace; font-size: 11px; fill: #FFFFFF; font-weight: 700; letter-spacing: 2px; }
      .main-title { font-family: 'Archivo Black', 'Impact', sans-serif; font-size: 28px; fill: #FFFFFF; font-weight: 900; letter-spacing: 1px; }
      .sub-title { font-family: 'Space Mono', 'Courier New', monospace; font-size: 11px; fill: #A3A3A3; letter-spacing: 1.5px; }
      .pulse-dot { animation: pulse 2s infinite ease-in-out; transform-origin: 40px 32px; fill: #22C55E; }
      .stat-val { font-family: 'Archivo Black', sans-serif; font-size: 22px; fill: #FFFFFF; }
      .stat-lbl { font-family: 'Space Mono', monospace; font-size: 9px; fill: #737373; font-weight: 700; letter-spacing: 1px; }
      .radar-line { stroke: #00FF66; stroke-width: 1.5; opacity: 0.7; transform-origin: 810px 80px; animation: radarSweep 4s linear infinite; }
      .grid-line { stroke: #262626; stroke-width: 1; }
      .border-pulse { stroke-dasharray: 8 4; animation: dash 2s linear infinite; stroke: #404040; }
    </style>
  </defs>

  <!-- Main Background Panel -->
  <rect x="2" y="2" width="896" height="156" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  
  <!-- Subtle Grid lines -->
  <line x1="2" y1="52" x2="898" y2="52" stroke="#262626" stroke-width="1.5"/>
  <line x1="580" y1="52" x2="580" y2="158" stroke="#262626" stroke-width="1.5"/>
  <line x1="720" y1="52" x2="720" y2="158" stroke="#262626" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="2" y="2" width="896" height="50" fill="#000000"/>
  <circle cx="28" cy="27" r="5" class="pulse-dot"/>
  <text x="44" y="31" class="header-text">ROADSENSE RAW // AUTONOMOUS ROAD HAZARD PERCEPTION SYSTEM</text>
  <rect x="748" y="14" width="134" height="26" fill="#171717" stroke="#404040" stroke-width="1"/>
  <text x="760" y="31" font-family="'Space Mono', monospace" font-size="10" fill="#22C55E" font-weight="700">● LIVE TELEMETRY</text>

  <!-- Main Showcase Content -->
  <text x="28" y="94" class="main-title">AI POTHOLE DEFECT INTELLIGENCE</text>
  <text x="28" y="122" class="sub-title">EDGE COMPUTER VISION &amp; HAVERSINE SPATIAL CLUSTERING ENGINE</text>
  <text x="28" y="140" font-family="'Space Mono', monospace" font-size="9" fill="#525252">MONOCULAR SURFACE CLASSIFICATION // PAN-INDIA CORRIDOR GIS</text>

  <!-- Metric 1: Total Hazards -->
  <text x="600" y="86" class="stat-lbl">DETECTED DEFECTS</text>
  <text x="600" y="118" class="stat-val">23,284</text>
  <text x="600" y="138" font-family="'Space Mono', monospace" font-size="9" fill="#22C55E">100% LAND-SNAPPED</text>

  <!-- Metric 2: Coverage -->
  <text x="740" y="86" class="stat-lbl">TERRITORY</text>
  <text x="740" y="118" class="stat-val">INDIA</text>
  <text x="740" y="138" font-family="'Space Mono', monospace" font-size="9" fill="#3B82F6">ALL HIGHWAY ZONES</text>

  <!-- Animated Border Accent -->
  <rect x="4" y="4" width="892" height="152" fill="none" class="border-pulse" stroke-width="1"/>
</svg>